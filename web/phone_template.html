<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

/* ══════════════════════════════════════════════
   SCENE & PHONE WRAPPER
   Phone ends in landscape (rotateZ -90deg).
   JS dynamically scales to fill viewport.
══════════════════════════════════════════════ */
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, 'Inter', sans-serif;
}

.scene {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  perspective: 1800px;
}

.phone-wrapper {
  transform-style: preserve-3d;
  --scale: 1;
  transform: rotateZ(-90deg) scale(var(--scale));
  animation: spinIn 2s cubic-bezier(0.23, 1, 0.32, 1) both;
  will-change: transform;
}

@keyframes spinIn {
  0%   { transform: rotateY(-540deg) rotateZ(-90deg) scale(0.3); opacity: 0; }
  40%  { opacity: 1; }
  75%  { transform: rotateY(15deg)  rotateZ(-90deg) scale(calc(var(--scale) * 1.04)); }
  90%  { transform: rotateY(-6deg)  rotateZ(-90deg) scale(calc(var(--scale) * 0.98)); }
  100% { transform: rotateY(0deg)   rotateZ(-90deg) scale(var(--scale)); opacity: 1; }
}

/* ══════════════════════════════════════════════
   PHONE SHELL  (portrait dimensions: 340 × 700)
   In landscape it visually appears: 700 × 340
══════════════════════════════════════════════ */
.phone {
  position: relative;
  width: 340px;
  height: 700px;
  border-radius: 48px;
  background: linear-gradient(160deg, #1c1c30 0%, #131325 50%, #0d0d20 100%);
  box-shadow:
    0 0 0 1.5px rgba(255,255,255,0.10),
    0 0 0 3px   rgba(0,0,0,0.85),
    inset 0 1px 0 rgba(255,255,255,0.13),
    0 0  80px rgba(0,245,255,0.14),
    0 0 160px rgba(123,47,255,0.10),
    40px 70px 140px rgba(0,0,0,0.75);
  transform-style: preserve-3d;
}

/* Side buttons */
.btn { position: absolute; background: linear-gradient(180deg, #252540, #1a1a30); border-radius: 2px; }
.btn-vu { left:-3px; top:140px; width:3px; height:38px; border-radius: 2px 0 0 2px; }
.btn-vd { left:-3px; top:192px; width:3px; height:38px; border-radius: 2px 0 0 2px; }
.btn-pw { right:-3px; top:170px; width:3px; height:65px; border-radius: 0 2px 2px 0; }

/* Dynamic Island */
.island {
  position: absolute; top:14px; left:50%; transform: translateX(-50%);
  width:95px; height:28px; background:#050512; border-radius:30px; z-index:10;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.i-cam { width:10px; height:10px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#1a3a5c,#060c18); border:1px solid rgba(255,255,255,0.04); }
.i-dot { width:5px; height:5px; border-radius:50%; background:radial-gradient(circle,#1e3a50,#0a1520); }

/* Phone shine */
.shine {
  position:absolute; inset:0; border-radius:48px; pointer-events:none; z-index:9;
  background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 45%, transparent 60%, rgba(255,255,255,0.02) 100%);
}

/* Screen container  */
.screen {
  position:absolute; top:13px; left:13px; right:13px; bottom:13px;
  border-radius:37px; overflow:hidden; background:#08080f;
}

/* ══════════════════════════════════════════════
   CONTENT INSIDE SCREEN
   Screen portrait: 314 × 674
   In landscape we need content: 674 × 314
   Counter-rotation: translateX(314px) rotate(90deg)
   Proof:
     1) rotate(90deg) from (0,0): (x,y)→(-y,x)
        674×314 element → spans x:[-314,0], y:[0,674]
     2) translateX(314px): spans x:[0,314], y:[0,674] ✓
══════════════════════════════════════════════ */
.content-landscape {
  position: absolute;
  width: 674px;
  height: 314px;
  transform-origin: 0 0;
  transform: translateX(314px) rotate(90deg);
  /* Portrait mode: undo rotation */
  transition: transform 0s, width 0s, height 0s;
}

.content-landscape.going-portrait {
  transform: none;
  width: 314px;
  height: 674px;
  transition: none;
}

/* Status bar (lives inside content-landscape; appears at top of landscape view) */
.status {
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 20px; height:40px;
  background: linear-gradient(180deg, rgba(8,8,15,1) 0%, rgba(8,8,15,0) 100%);
  position: relative; z-index: 2;
  flex-shrink: 0;
}
.status-time { color:#fff; font-size:12px; font-weight:700; letter-spacing:0.5px; }
.status-icons { display:flex; gap:5px; align-items:center; }

/* Scroll area for cards */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 14px 20px;
  -webkit-overflow-scrolling: touch;
}
.scroll-area::-webkit-scrollbar { width:2px; }
.scroll-area::-webkit-scrollbar-thumb { background:rgba(0,245,255,0.25); border-radius:2px; }

.section-label {
  font-size:10px; font-weight:800; letter-spacing:3px; text-transform:uppercase;
  background: linear-gradient(90deg,#00F5FF,#7B2FFF);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:14px; padding:0 2px;
}

/* ── CARDS ── */
.card {
  position: relative;
  background: rgba(255,255,255,0.04);
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius:14px; padding:14px; margin-bottom:10px;
  cursor:pointer; overflow:hidden;
  backdrop-filter: blur(8px);
  animation: slideUp 0.4s cubic-bezier(0.23,1,0.32,1) both;
  transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
.card:hover {
  background:rgba(255,255,255,0.08);
  border-color: var(--accent);
  transform:translateY(-2px);
  box-shadow: 0 6px 24px color-mix(in srgb, var(--accent) 20%, transparent);
}
.card:active { transform:scale(0.98); }

.card-glow { position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:0.5; }
.card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
.card-icon { width:32px; height:32px; border-radius:9px;
  background:color-mix(in srgb, var(--accent) 15%, transparent);
  display:flex; align-items:center; justify-content:center; }
.live-badge { font-size:8px; font-weight:800; letter-spacing:1.5px;
  border:1px solid; border-radius:20px; padding:2px 8px; opacity:0.85; }
.card-title { color:#fff; font-size:13px; font-weight:700; margin-bottom:5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-desc { color:rgba(255,255,255,0.45); font-size:10px; line-height:1.6; margin-bottom:10px; }
.card-footer { border-top:1px solid rgba(255,255,255,0.05); padding-top:8px; }
.open-btn { font-size:10px; font-weight:700; letter-spacing:0.5px; }

/* ══════════════════════════════════════════════
   PORTRAIT MODE OVERLAY (project iframe)
   Shows when phone transitions to portrait
══════════════════════════════════════════════ */
.portrait-overlay {
  display: none;
  position: absolute; inset: 0; z-index: 50;
  flex-direction: column; background:#000;
  animation: fadeInOverlay 0.3s ease;
}
@keyframes fadeInOverlay {
  from { opacity:0; } to { opacity:1; }
}
.portrait-overlay.visible { display:flex; }

.overlay-bar {
  display:flex; align-items:center;
  padding:10px 14px; gap:8px;
  background:rgba(0,0,0,0.95);
  border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0;
}
.dot-btn { width:10px; height:10px; border-radius:50%; cursor:pointer; border:none; }
.dot-close { background:#FF5F57; }
.dot-close:hover { filter:brightness(1.3); }
.dot-min { background:#FEBC2E; }
.dot-full { background:#28C840; }
.overlay-url { flex:1; color:rgba(255,255,255,0.35); font-size:9px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 6px; }
.project-frame { flex:1; border:none; width:100%; }
</style>
</head>
<body>
<div class="scene">
  <div class="phone-wrapper" id="phoneWrapper">
    <div class="phone">
      <div class="btn btn-vu"></div>
      <div class="btn btn-vd"></div>
      <div class="btn btn-pw"></div>
      <div class="island"><div class="i-dot"></div><div class="i-cam"></div><div class="i-dot"></div></div>
      <div class="shine"></div>

      <div class="screen">

        <!-- LANDSCAPE CONTENT (counter-rotated to appear upright) -->
        <div class="content-landscape" id="contentLandscape">
          <div style="display:flex; flex-direction:column; height:100%;">
            <div class="status">
              <span class="status-time" id="clock">9:41</span>
              <div class="status-icons">
                <svg width="15" height="11" viewBox="0 0 15 11" fill="white">
                  <path d="M7.5 2C10 2 12.2 3.1 13.7 4.8L15 3.3C13.1 1.2 10.5 0 7.5 0S1.9 1.2 0 3.3L1.3 4.8C2.8 3.1 5 2 7.5 2z"/>
                  <path d="M7.5 5.5C9.2 5.5 10.7 6.2 11.8 7.3L13.1 5.8C11.7 4.4 9.7 3.5 7.5 3.5s-4.2.9-5.6 2.3l1.3 1.5C4.3 6.2 5.8 5.5 7.5 5.5z"/>
                  <path d="M7.5 9C8.5 9 9.4 9.4 10 10.1L7.5 13 5 10.1C5.6 9.4 6.5 9 7.5 9z"/>
                </svg>
                <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
                  <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="white" stroke-opacity=".5"/>
                  <rect x="2" y="2" width="15" height="8" rx="1.5" fill="white"/>
                  <path d="M22 4v4a2 2 0 000-4z" fill="white" fill-opacity=".4"/>
                </svg>
              </div>
            </div>
            <div class="scroll-area" id="scrollArea">
              <div class="section-label">My Projects</div>
              %%CARDS%%
            </div>
          </div>
        </div>

        <!-- PORTRAIT OVERLAY (shown after phone rotates to portrait) -->
        <div class="portrait-overlay" id="portraitOverlay">
          <div class="overlay-bar">
            <button class="dot-btn dot-close" onclick="closeProject()"></button>
            <button class="dot-btn dot-min"></button>
            <button class="dot-btn dot-full"></button>
            <span class="overlay-url" id="overlayUrl"></span>
          </div>
          <iframe class="project-frame" id="projectFrame"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
            allow="fullscreen">
          </iframe>
        </div>

      </div><!-- /screen -->
    </div><!-- /phone -->
  </div><!-- /phone-wrapper -->
</div><!-- /scene -->

<script>
// ── Clock ──
(function tick() {
  var d = new Date();
  var el = document.getElementById('clock');
  if(el) el.textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  setTimeout(tick, 30000);
})();

// ── Scale phone to fill viewport in landscape ──
var wrapper = document.getElementById('phoneWrapper');
function fitPhone() {
  var vw = window.innerWidth, vh = window.innerHeight;
  // Phone in landscape: appears 700px wide × 340px tall
  var scaleX = (vw * 0.92) / 700;
  var scaleY = (vh * 0.88) / 340;
  var s = Math.min(scaleX, scaleY);
  wrapper.style.setProperty('--scale', s);
  // Re-apply transform so CSS var updates
  if (!wrapper.classList.contains('in-portrait')) {
    wrapper.style.transform = 'rotateZ(-90deg) scale(' + s + ')';
  }
}
fitPhone();
window.addEventListener('resize', fitPhone);

// ── Project open / close ──
var currentScale = 1;

function openProject(url) {
  var vw = window.innerWidth, vh = window.innerHeight;
  var scaleX = (vw * 0.92) / 700;
  var scaleY = (vh * 0.88) / 340;
  currentScale = Math.min(scaleX, scaleY);

  // Step 1: hide landscape content immediately
  var content = document.getElementById('contentLandscape');
  content.style.opacity = '0';
  content.style.transition = 'opacity 0.2s';

  // Step 2: rotate phone to portrait + scale to fill portrait space
  // Portrait: phone is 340×700. Scale to fill viewport
  var pScaleX = (vw * 0.80) / 340;
  var pScaleY = (vh * 0.90) / 700;
  var pScale = Math.min(pScaleX, pScaleY);

  wrapper.style.transition = 'transform 0.8s cubic-bezier(0.23,1,0.32,1)';
  wrapper.style.transform = 'rotateZ(0deg) scale(' + pScale + ')';
  wrapper.classList.add('in-portrait');

  // Step 3: after rotation completes, show iframe
  setTimeout(function() {
    var overlay = document.getElementById('portraitOverlay');
    var frame = document.getElementById('projectFrame');
    var urlLabel = document.getElementById('overlayUrl');
    frame.src = url;
    if(urlLabel) urlLabel.textContent = url;
    overlay.classList.add('visible');
  }, 700);
}

function closeProject() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var scaleX = (vw * 0.92) / 700;
  var scaleY = (vh * 0.88) / 340;
  var lScale = Math.min(scaleX, scaleY);

  // Hide overlay
  var overlay = document.getElementById('portraitOverlay');
  var frame = document.getElementById('projectFrame');
  overlay.classList.remove('visible');
  frame.src = 'about:blank';

  // Rotate back to landscape
  wrapper.style.transition = 'transform 0.8s cubic-bezier(0.23,1,0.32,1)';
  wrapper.style.transform = 'rotateZ(-90deg) scale(' + lScale + ')';
  wrapper.classList.remove('in-portrait');

  // Restore content
  setTimeout(function() {
    var content = document.getElementById('contentLandscape');
    content.style.opacity = '1';
    content.style.transition = 'opacity 0.3s';
  }, 600);
}
</script>
</body>
</html>
